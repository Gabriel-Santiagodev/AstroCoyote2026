<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:," />
<title>Construcción de Rover — Taller Lunar</title>
<style>
  :root{
    --bg-blueprint:#232a35;
    --grid-line:#454f5e;
    --panel-dark:#13161B;
    --panel-card:#1A1E25;
    --panel-border:#2C323D;
    --accent-blue:#0088FF;
    --accent-green:#22C55E;
    --accent-amber:#F59E0B;
    --accent-red:#EF4444;
    --text-main:#F3F4F6;
    --text-muted:#9CA3AF;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background-color:var(--bg-blueprint);
    color:var(--text-main);
    height:100vh;height:100dvh;width:100vw;overflow:hidden;position:relative;
    user-select:none;-webkit-user-select:none;
  }
  button{min-height:36px}

  /* ============ ASSEMBLY ROOM BACKGROUND (sala cuadrada tipo Ellipse) ============ */
  .blueprint-canvas{position:absolute;inset:0;background-color:#1b212b;overflow:hidden;pointer-events:none}
  .room-scene{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .perspective-overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

  /* ============ TOP HUD ============ */
  .top-left-controls{position:absolute;top:12px;left:12px;display:flex;gap:8px;z-index:30}
  .top-right-controls{position:absolute;top:12px;right:12px;display:flex;gap:8px;z-index:30}
  .hud-btn{height:46px;min-width:46px;padding:0 14px;background:var(--panel-dark);border:1px solid #262B34;border-radius:7px;color:#fff;font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 12px rgba(0,0,0,.35);transition:background .15s,transform .1s}
  .hud-btn:hover{background:#1E232B}
  .hud-btn:active{transform:scale(.97)}
  .btn-launch{padding:0 22px;font-size:16px;letter-spacing:.3px;background:#0B3D91;border-color:#1D5FD1}
  .btn-launch:hover{background:#0E4CAD}

  /* ============ LEFT TOOLS ============ */
  .left-tools-wrapper{position:absolute;left:12px;top:50%;transform:translateY(-48%);display:flex;align-items:center;gap:10px;z-index:25}
  .tool-column{background:var(--panel-dark);border:1px solid #262B34;border-radius:9px;padding:5px;display:flex;flex-direction:column;gap:5px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
  .tool-btn{width:46px;height:46px;border:none;border-radius:7px;background:transparent;color:#E5E7EB;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
  .tool-btn:hover{background:#222731}
  .tool-btn.active{background:var(--accent-blue);color:#fff}
  .nudge-column{display:flex;flex-direction:column;gap:8px}
  .nudge-btn{width:48px;height:48px;background:var(--panel-dark);border:1px solid #262B34;border-radius:8px;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.35)}
  .nudge-btn:hover{background:#1F242D}
  .bottom-left-controls{position:absolute;bottom:12px;left:12px;display:flex;gap:8px;z-index:25}

  /* ============ RIGHT PALETTE ============ */
  .right-palette-wrapper{position:absolute;right:12px;top:50%;transform:translateY(-46%);display:flex;align-items:flex-start;gap:8px;z-index:25}
  .parts-drawer{background:rgba(19,22,27,.94);border:1px solid #2A303B;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.45);width:186px;max-height:min(78dvh,640px)}
  .parts-grid-2col{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;overflow-y:auto;padding-right:2px}
  .grid-part-item{height:76px;background:#22262e;border:1.5px solid #2B313C;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:grab;position:relative;transition:all .15s;padding:5px;overflow:hidden}
  .grid-part-item img{max-width:100%;max-height:56px;object-fit:contain;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
  .grid-part-item img.rect{width:100%;height:56px;object-fit:cover;border-radius:4px}
  .grid-part-item:hover:not(.locked):not(.pending-card){border-color:var(--accent-blue);background:#2a303c;transform:translateY(-1px)}
  .grid-part-item.equipped{border-color:var(--accent-green);background:rgba(34,197,94,.14)}
  .grid-part-item.locked{cursor:pointer;opacity:.75}
  .grid-part-item.pending-card{cursor:pointer;border-style:dashed;background:#1A1E25}
  .padlock-icon{font-size:24px;color:#9aa3b2;display:flex;align-items:center;justify-content:center}
  .padlock-icon svg{width:24px;height:24px}
  .pending-icon{font-size:22px}
  .pending-txt{font-size:9.5px;color:var(--accent-amber);font-weight:700;text-align:center;line-height:1.25;margin-top:3px}
  .part-mini-price{position:absolute;bottom:3px;right:5px;font-size:9px;font-weight:700;color:#D1D5DB;background:rgba(0,0,0,.45);padding:1px 4px;border-radius:3px}
  .part-inspector{background:#12151A;border:1px solid #282E38;border-radius:7px;padding:8px 9px;font-size:11px}
  .part-inspector strong{display:block;font-size:12px;color:#fff;margin-bottom:2px}
  .part-inspector span{display:block;color:var(--text-muted);font-size:10.5px;margin-bottom:5px;line-height:1.4}
  .inspector-pills{display:flex;flex-wrap:wrap;gap:4px}
  .i-pill{background:#1E232C;border:1px solid #303744;padding:2px 5px;border-radius:4px;font-size:10px;color:#E5E7EB;font-weight:600}
  .category-strip{background:var(--panel-dark);border:1px solid #262B34;border-radius:9px;padding:5px;display:flex;flex-direction:column;gap:5px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
  .cat-btn{width:44px;height:44px;border:none;border-radius:7px;background:transparent;color:#9CA3AF;font-size:19px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:3px 0 2px;transition:all .15s}
  .cat-btn:hover{background:#20252E;color:#fff}
  .cat-btn.active{background:var(--accent-blue);color:#fff}
  .cat-btn .cat-ico{width:23px;height:23px;flex:none}
  .cat-btn .cat-label{font-size:7.8px;line-height:1;font-weight:700;letter-spacing:.15px;color:inherit;white-space:nowrap}

  /* ============ CENTER ASSEMBLY ============ */
  .assembly-center-zone{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;pointer-events:none}
  .rover-stack{pointer-events:auto;display:flex;flex-direction:column;align-items:center;transition:transform .18s ease;will-change:transform}
  .bp-slot{border:1.5px dashed rgba(255,255,255,.28);background:rgba(19,22,27,.42);display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;transition:all .15s}
  .bp-slot:hover{border-color:rgba(0,136,255,.7);background:rgba(0,136,255,.1)}
  .bp-slot.drag-over{border-color:var(--accent-blue);background:rgba(0,136,255,.25);transform:scale(1.04)}
  .bp-slot.filled{border:1.5px solid transparent;background:transparent}
  .bp-slot.filled.selected{border:1.5px solid var(--accent-blue);background:rgba(0,136,255,.08);border-radius:4px}
  .bp-slot.selected:not(.filled){border-color:var(--accent-blue)}
  .bp-slot.shake{animation:shake .28s ease;border-color:var(--accent-red)}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .bp-slot-hint{font-size:10px;color:rgba(255,255,255,.6);text-align:center;padding:2px 6px;pointer-events:none;line-height:1.35}
  .bp-slot-hint b{color:var(--accent-amber);display:block;font-size:10.5px;letter-spacing:.4px}
  .slot-del-btn{position:absolute;right:-24px;top:50%;transform:translateY(-50%);width:22px;height:22px;min-height:22px;border-radius:50%;background:var(--accent-red);color:#fff;border:none;font-size:11px;font-weight:bold;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:5}
  .bp-slot.filled:hover .slot-del-btn,.bp-slot.filled.selected .slot-del-btn{display:flex}
  .launchpad-support-base{width:200px;height:18px;background:#14171D;border:1.5px solid #4B5563;border-radius:4px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;margin-top:3px;position:relative;flex:none}
  .base-clamp{width:14px;height:10px;background:var(--accent-amber);border-radius:2px}
  .base-label{font-size:9px;letter-spacing:.8px;color:#9CA3AF;font-weight:700}


  /* ============ TELEMETRY ============ */
  .bottom-telemetry-bar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(19,22,27,.94);border:1px solid #2A303B;border-radius:9px;padding:8px 16px;display:flex;align-items:center;gap:16px;z-index:25;box-shadow:0 6px 18px rgba(0,0,0,.45);max-width:calc(100vw - 24px)}
  .t-metric{display:flex;flex-direction:column;align-items:center;white-space:nowrap}
  .t-metric span{font-size:9.5px;text-transform:uppercase;color:var(--text-muted);letter-spacing:.5px}
  .t-metric strong{font-size:14px;font-weight:700;color:#fff}
  .t-divider{width:1px;height:24px;background:#2C323D;flex:none}
  .ok{color:var(--accent-green)!important}.warn{color:var(--accent-amber)!important}.bad{color:var(--accent-red)!important}

  /* ============ MODAL ============ */
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
  .modal-backdrop.open{display:flex}
  .summary-modal{background:#171A20;border:1px solid #2E3542;border-radius:12px;width:100%;max-width:460px;padding:22px;box-shadow:0 12px 32px rgba(0,0,0,.6);max-height:88dvh;overflow-y:auto}
  .summary-modal h3{font-size:18px;margin-bottom:6px}
  .summary-modal p{font-size:13px;color:var(--text-muted);margin-bottom:14px;line-height:1.45}
  .assembled-list{background:#111318;border:1px solid #262B35;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;margin-bottom:16px;font-size:12.5px}
  .assembled-row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #1D2129;padding-bottom:5px}
  .assembled-row:last-child{border-bottom:none;padding-bottom:0}
  .assembled-row strong{text-align:right}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
  .m-btn{padding:9px 16px;border-radius:7px;border:1px solid #323946;background:#222731;color:#fff;font-size:13px;font-weight:600;cursor:pointer;min-height:40px}
  .m-btn.primary{background:var(--accent-blue);border-color:var(--accent-blue)}

  /* ============ MOBILE ============ */
  @media (max-width:860px){
    .nudge-column{display:none}
    .left-tools-wrapper{top:150px;bottom:auto;transform:none;left:8px}
    .bottom-left-controls{top:392px;bottom:auto;left:8px;right:auto;flex-direction:column}
    .right-palette-wrapper{top:auto;bottom:74px;right:8px;left:8px;transform:none;flex-direction:column-reverse;align-items:stretch}
    .category-strip{flex-direction:row;justify-content:space-between;padding:4px}
    .cat-btn{width:40px;height:40px;font-size:17px}
    .parts-drawer{width:auto;max-height:172px;padding:8px}
    .parts-grid-2col{display:flex;overflow-x:auto;overflow-y:hidden;padding-bottom:2px}
    .grid-part-item{flex:0 0 74px;height:70px}
    .part-inspector{display:none}
    .bottom-telemetry-bar{gap:8px;padding:7px 9px;bottom:8px}
    .t-metric span{font-size:8.5px}
    .t-metric strong{font-size:12.5px}
    .t-opt{display:none}
    .hud-btn{height:42px;min-width:42px}
    .assembly-center-zone{top:58px;bottom:332px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  /* ============ TALLER DEL ROVER ============ */
  .assembly-center-zone{justify-content:flex-end;padding-bottom:92px}
  .rover-stack{transform-origin:50% 100%}
  .rover-stage{position:relative;width:600px;height:308px;flex:none}
  .rv-slot{position:absolute}
  .rv-slot.filled{border:0;background:transparent;border-radius:0}
  .rv-slot.filled svg{display:block;pointer-events:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.4))}
  .rv-slot.filled.selected{box-shadow:0 0 0 2px var(--accent-blue);background:rgba(0,136,255,.08)}
  .rv-slot.rv-hidden{visibility:hidden;pointer-events:none}
  .rv-slot .bp-slot-hint{font-size:9.5px}
  .rv-slot.opt{border-color:rgba(255,255,255,.18)}
  #slot-chasis{left:110px;top:190px;width:380px;height:52px;z-index:1}
  #slot-bateria{left:140px;top:140px;width:130px;height:50px;z-index:2}
  #slot-panel{left:112px;top:79px;width:170px;height:62px;z-index:2}
  #slot-asiento{left:296px;top:105px;width:110px;height:85px;z-index:2}
  #slot-antena{left:424px;top:44px;width:50px;height:150px;z-index:2}
  #slot-herramienta{left:476px;top:164px;width:96px;height:84px;z-index:2}
  #slot-carga{left:20px;top:196px;width:96px;height:56px;z-index:2}
  #slot-wheel-r{left:102px;top:214px;width:96px;height:96px;z-index:4;border-radius:50%}
  #slot-wheel-m{left:252px;top:214px;width:96px;height:96px;z-index:4;border-radius:50%}
  #slot-wheel-f{left:402px;top:214px;width:96px;height:96px;z-index:4;border-radius:50%}
  #slot-wheel-r.filled,#slot-wheel-m.filled,#slot-wheel-f.filled{border-radius:50%}
  .rover-base{width:660px;height:16px;background:#14171D;border:1.5px solid #4B5563;border-radius:4px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:relative;flex:none}
  .bottom-left-controls .tool-btn{background:#13161B}
  .bottom-left-controls .tool-btn.active{background:var(--accent-blue)}
  .t-txt{font-size:13px!important}
  @media (max-width:860px){
    .rover-base{width:620px}
  }
  /* Ajustes de alcance táctil: ranura oculta fuera del flujo, botón de quitar dentro de su ranura y visible sin hover, selector 4×4/6×6 sin tapar la ranura de carga en móvil */
  .rv-slot.rv-hidden{display:none!important}
  .slot-del-btn{right:3px;top:3px;transform:none;z-index:9}
  /* El boton de quitar del chasis va a la izquierda de su ranura: a la derecha
     lo taparia la ranura de herramienta, que ahora se solapa con el frente
     del chasis para que su placa quede atornillada al bastidor delantero. */
  #slot-chasis .slot-del-btn{right:auto;left:10px}
  .bp-slot.filled.selected{z-index:8}
  @media (hover:none){
    .bp-slot.filled .slot-del-btn{display:flex}
  }
  @media (max-width:860px){
    .bottom-left-controls{top:64px;bottom:auto;left:8px;right:auto;flex-direction:row}
    .left-tools-wrapper{top:118px;bottom:auto;left:8px;transform:none}
    .tool-column{flex-direction:row}
    .bottom-telemetry-bar{gap:6px;flex-wrap:wrap;justify-content:center;row-gap:2px}
  }
  /* ============ DOCK INFERIOR UNIFICADO (móvil vertical Y horizontal) ============
     Un solo bloque autoritativo para pantallas táctiles: la telemetría queda
     fija abajo con altura conocida y la paleta (categorías + tarjetas) se
     ancla justo encima, sin solapes en ninguna orientación. Antes había tres
     bloques en conflicto y en horizontal la paleta quedaba fuera de pantalla
     o tapada, por lo que las categorías parecían no cargar. */
  @media (max-width:1100px){
    .bottom-telemetry-bar{left:8px;right:8px;bottom:8px;transform:none;max-width:none;z-index:30}
    .bottom-telemetry-bar .t-divider{display:none}
    .right-palette-wrapper{left:8px;right:8px;top:auto;transform:none;flex-direction:column-reverse;align-items:stretch;z-index:29}
    .category-strip{flex-direction:row;justify-content:space-between;padding:4px}
    .cat-btn{width:40px;height:40px;font-size:17px}
    .parts-drawer{width:auto}
    .part-inspector{display:none}
    .nudge-column{display:none}
  }
  /* Vertical: telemetría en 2 filas y TODAS las tarjetas de la categoría a la vez */
  @media (max-width:860px) and (orientation:portrait){
    .bottom-telemetry-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:3px 10px;padding:7px 12px}
    .right-palette-wrapper{bottom:94px}
    .parts-drawer{max-height:none;padding:8px}
    .parts-grid-2col{display:flex;flex-wrap:wrap;overflow:visible;gap:6px;padding:0}
    .grid-part-item{flex:0 0 calc(25% - 5px);height:66px}
    .assembly-center-zone{top:58px;bottom:322px;padding-bottom:6px}
    .left-tools-wrapper{top:118px;bottom:auto;left:8px;transform:none}
    .tool-column{flex-direction:row}
    .bottom-left-controls{top:64px;bottom:auto;left:8px;right:auto;flex-direction:row}
  }
  /* Horizontal (teléfono girado, como en las capturas): telemetría en 1 fila y
     paleta en una sola fila de tarjetas deslizable, siempre visible */
  @media (max-height:560px){
    .bottom-telemetry-bar{display:grid;grid-template-columns:repeat(6,1fr);gap:2px 8px;padding:5px 10px}
    .bottom-telemetry-bar .t-opt{display:none}
    .right-palette-wrapper{bottom:64px}
    .parts-drawer{max-height:none;padding:7px}
    .parts-grid-2col{display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;gap:6px;padding:0 0 2px}
    .grid-part-item{flex:0 0 64px;height:58px}
    .assembly-center-zone{top:52px;bottom:216px;padding-bottom:4px}
    .left-tools-wrapper{top:110px;bottom:auto;left:8px;transform:none}
    .tool-column{flex-direction:row}
    .bottom-left-controls{top:60px;bottom:auto;left:8px;right:auto;flex-direction:row}
    .hud-btn{height:40px;min-width:40px}
  }
  /* ============ DESCONGELADO: capas, puntero y toque (sin cambios visuales) ============
     Las capas decorativas nunca reciben el cursor; los envoltorios de los
     paneles tampoco: solo reciben eventos sus controles reales, para que un
     contenedor transparente jamás tape el rover, la barra izquierda ni el HUD. */
  .blueprint-canvas,.room-scene,.perspective-overlay{pointer-events:none!important}
  .top-left-controls,.top-right-controls,.left-tools-wrapper,.bottom-left-controls,.right-palette-wrapper{pointer-events:none}
  .top-left-controls .hud-btn,.top-right-controls .hud-btn,.tool-column,.nudge-column,.bottom-left-controls .tool-btn,.parts-drawer,.category-strip{pointer-events:auto}
  .bottom-telemetry-bar,.modal-backdrop{pointer-events:auto}
  .assembly-center-zone{pointer-events:none}
  .rover-stack{pointer-events:auto}
  button,.cat-btn,.tool-btn,.hud-btn,.nudge-btn{touch-action:manipulation}
  .grid-part-item{touch-action:none;-webkit-user-select:none;user-select:none}
  .grid-part-item svg{pointer-events:none}
  .drag-ghost svg{max-width:76px;max-height:56px;pointer-events:none}
  .rv-slot{touch-action:manipulation}
  .hud-btn.paused{background:var(--accent-amber);border-color:var(--accent-amber);color:#13161B}
  .drag-ghost{position:fixed;z-index:999;pointer-events:none;width:84px;height:64px;background:rgba(19,22,27,.92);border:1.5px solid var(--accent-blue);border-radius:8px;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%);opacity:.95;box-shadow:0 8px 20px rgba(0,0,0,.5)}

  /* ============ PULIDO FINAL: borde izquierdo, piloto, carga y tracción ============ */
  /* 1) Nada cortado en el borde izquierdo: la columna de herramientas y el
     selector inferior quedan siempre dentro del margen visible (con safe-area) */
  .left-tools-wrapper{left:max(16px,env(safe-area-inset-left,0px))}
  .left-tools-wrapper .tool-column{overflow:visible;flex:none}
  .left-tools-wrapper .tool-btn{flex:none}
  .bottom-left-controls{left:max(16px,env(safe-area-inset-left,0px))}
  @media (max-width:1100px){
    .left-tools-wrapper{left:max(10px,env(safe-area-inset-left,0px))}
    .bottom-left-controls{left:max(10px,env(safe-area-inset-left,0px))}
  }
  /* 3) Badge compacto del piloto activo, junto a los controles superiores */
  .pilot-badge{display:flex;align-items:center;gap:8px;height:46px;padding:0 12px;background:var(--panel-dark);border:1px solid #262B34;border-radius:7px;box-shadow:0 4px 12px rgba(0,0,0,.35)}
  .pb-dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.08)}
  .pb-astro{width:34px;height:34px;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
  .pb-txt{display:flex;flex-direction:column;line-height:1.18}
  .pb-txt strong{font-size:12.5px;color:#fff;white-space:nowrap}
  .pb-txt small{font-size:10.5px;color:var(--accent-green);font-weight:700;white-space:nowrap}
  @media (max-width:520px){
    .pilot-badge{height:42px;padding:0 8px;gap:6px}
    .pb-txt strong{font-size:11.5px}
    .pb-txt small{font-size:9.5px}
  }
  /* 4a) Ranura "Carga (opcional)": borde punteado sutil tipo plano técnico */
  #slot-carga:not(.filled){border:1.5px dashed rgba(147,183,228,.55);background:rgba(11,61,145,.08)}
  #slot-carga:not(.filled) .bp-slot-hint{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.3px;color:rgba(203,225,250,.72)}
  /* Se oculta al pulsar "Iniciar misión" y en impresión / captura */
  body.launching #slot-carga:not(.filled){visibility:hidden}
  @media print{ #slot-carga:not(.filled){display:none!important} }
  /* 4b) Botón "Probar tracción" junto al selector 4×4 / 6×6 */
  .btn-test{width:auto!important;padding:0 12px;font-size:12.5px;font-weight:700;border:1px solid #262B34!important;border-radius:7px;white-space:nowrap}
  .btn-test:active{background:var(--accent-blue)!important;color:#fff}
  .bottom-left-controls{flex-wrap:wrap}
  /* ============ ANIMACIÓN CINEMÁTICA: MODO MOVIMIENTO (Probar tracción / misión) ============
     Todo el sistema se activa con la clase .is-moving sobre #rover-stack.
     Al detener, las animaciones cesan y cada pieza vuelve a su posición base. */
  /* Base de ensamblaje: marcas amarillas que se desplazan a la izquierda en bucle */
  .rover-base{overflow:hidden}
  .rover-base>*{position:relative;z-index:1}
  .rover-base::before{content:"";position:absolute;top:0;bottom:0;left:0;width:calc(100% + 76px);z-index:0;background:repeating-linear-gradient(90deg,transparent 0 30px,#d9ba3a 30px 52px,transparent 52px 76px);opacity:0}
  .rover-stack.is-moving .rover-base::before{opacity:.85;animation:baseScroll var(--base-period,1.4s) linear infinite}
  @keyframes baseScroll{from{transform:translateX(0)}to{transform:translateX(-76px)}}
  /* Botón en modo activo: "Detener prueba" resaltado en verde/azul */
  .btn-test.moving{background:linear-gradient(90deg,#22C55E,#0088FF)!important;color:#fff!important;border-color:#22C55E!important}
  /* Ruedas: giro sobre su centro exacto, velocidad ligada a la telemetría */
  @keyframes wheelSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  .wheel-rotor{transform-box:fill-box;transform-origin:center}
  .rover-stack.is-moving .wheel-rotor{animation:wheelSpin var(--wheel-period,1s) linear infinite}
  .rover-stack:not(.is-moving) .wheel-rotor{transition:transform .45s ease-out}
  /* Suspensión activa: cada eje sube y baja con desfase (trasera / media / delantera) */
  @keyframes wheelBounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-3.5px)}55%{transform:translateY(.5px)}75%{transform:translateY(-1.8px)}}
  .rover-stack.is-moving #slot-wheel-r{animation:wheelBounce .92s ease-in-out infinite}
  .rover-stack.is-moving #slot-wheel-m{animation:wheelBounce .92s ease-in-out .18s infinite}
  .rover-stack.is-moving #slot-wheel-f{animation:wheelBounce .92s ease-in-out .36s infinite}
  /* Rebote general del chasis sobre la base */
  @keyframes suspBounce{0%,100%{transform:translateY(0)}25%{transform:translateY(-2.5px)}55%{transform:translateY(.8px)}80%{transform:translateY(-1.2px)}}
  .rover-stack.is-moving .rover-stage{animation:suspBounce .92s ease-in-out infinite}
  /* Astronauta: rebote del torso/casco sincronizado con la suspensión (.92s) */
  .rover-stack.is-moving .astro-bob{animation:astroBob .92s ease-in-out infinite}
  @keyframes astroBob{0%,100%{transform:translateY(0)}40%{transform:translateY(1.8px)}70%{transform:translateY(.6px)}}
  /* Astronauta sentado de perfil: brazos/manos sobre la palanca, origen en el hombro (62,50) */
  .astro-arm{transform-box:view-box;transform-origin:62px 50px}
  .rover-stack.is-moving .astro-arm{animation:armDrive .92s ease-in-out infinite}
  @keyframes armDrive{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(8deg)}}
  .astro-lever{transform-box:view-box;transform-origin:90px 68px}
  /* Al probar tracción o iniciar misión: sin recuadro azul de selección ni X roja */
  body.is-moving .rv-slot.selected,body.is-moving .rv-slot.filled.selected,body.launching .rv-slot.selected,body.launching .rv-slot.filled.selected{box-shadow:none!important;border-color:transparent!important;background:transparent!important;outline:none!important}
  body.is-moving .slot-del-btn,body.launching .slot-del-btn{display:none!important}
  .rover-stack.is-moving .astro-lever{animation:leverMove .92s ease-in-out infinite}
  @keyframes leverMove{0%,100%{transform:rotate(7deg)}50%{transform:rotate(-7deg)}}
  /* Brazo robótico: hombro, codo y pinzas amarillas que se abren y cierran */
  .arm-upper{transform-box:view-box;transform-origin:18px 43px}
  .arm-fore{transform-box:view-box;transform-origin:44px 20px}
  .arm-claw-a,.arm-claw-b{transform-box:view-box;transform-origin:70px 40px}
  .rover-stack.is-moving .arm-upper{animation:armSwing 3.2s ease-in-out infinite alternate}
  @keyframes armSwing{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
  .rover-stack.is-moving .arm-fore{animation:foreSwing 2.3s ease-in-out infinite alternate}
  @keyframes foreSwing{from{transform:rotate(6deg)}to{transform:rotate(-8deg)}}
  .rover-stack.is-moving .arm-claw-a{animation:clawA .95s ease-in-out infinite alternate}
  .rover-stack.is-moving .arm-claw-b{animation:clawB .95s ease-in-out infinite alternate}
  @keyframes clawA{from{transform:rotate(0deg)}to{transform:rotate(13deg)}}
  @keyframes clawB{from{transform:rotate(0deg)}to{transform:rotate(-13deg)}}
  /* Taladro lunar: el cabezal desciende, la broca gira y salta polvo de regolito */
  .rover-stack.is-moving .drill-head{animation:drillDown 1.5s ease-in-out infinite}
  @keyframes drillDown{0%,100%{transform:translateY(0)}45%,60%{transform:translateY(4px)}}
  .drill-bit{transform-box:fill-box;transform-origin:center}
  .rover-stack.is-moving .drill-bit{animation:bitSpin .45s linear infinite}
  @keyframes bitSpin{0%,100%{transform:scaleX(1)}25%{transform:scaleX(.3)}50%{transform:scaleX(1)}75%{transform:scaleX(.3)}}
  .dust{opacity:0}
  .rover-stack.is-moving .dust{animation:dustPuff 1.15s ease-out infinite}
  .rover-stack.is-moving .dust.d2{animation-delay:.3s}
  .rover-stack.is-moving .dust.d3{animation-delay:.55s}
  .rover-stack.is-moving .dust.d4{animation-delay:.8s}
  @keyframes dustPuff{0%{transform:translate(0,0);opacity:0}20%{opacity:.85}100%{transform:translate(var(--dx,-6px),-5px);opacity:0}}
  /* Pala excavadora: ciclo de paleo hacia adelante y arriba */
  .shovel-move{transform-box:view-box;transform-origin:18px 43px}
  .rover-stack.is-moving .shovel-move{animation:shovelCycle 2.4s ease-in-out infinite}
  @keyframes shovelCycle{0%,100%{transform:rotate(0deg) translate(0,0)}30%{transform:rotate(5deg) translate(3px,2px)}60%{transform:rotate(-7deg) translate(6px,-3px)}80%{transform:rotate(-2deg) translate(3px,-1px)}}
  /* Antena: ondas de radio concéntricas desde la punta naranja */
  .ant-wave{fill:none;stroke:#F59E0B;stroke-width:1.6;opacity:0;transform-box:fill-box;transform-origin:center}
  .rover-stack.is-moving .ant-wave{animation:wavePulse 1.8s ease-out infinite}
  .rover-stack.is-moving .ant-wave.aw2{animation-delay:.6s}
  .rover-stack.is-moving .ant-wave.aw3{animation-delay:1.2s}
  @keyframes wavePulse{0%{transform:scale(.35);opacity:.95}70%{opacity:.35}100%{transform:scale(2.3);opacity:0}}
  /* Panel solar: ajuste suave de inclinación buscando la luz */
  .panel-tilt{transform-box:view-box;transform-origin:85px 42px}
  .rover-stack.is-moving .panel-tilt{animation:panelTilt 3.8s ease-in-out infinite alternate}
  @keyframes panelTilt{from{transform:rotate(-2.6deg)}to{transform:rotate(2.6deg)}}
  /* Panel sin batería: apoyo metálico visible + aviso en la ranura */
  #slot-panel.needs-batt::after{content:"";position:absolute;left:6%;right:6%;bottom:-3px;height:5px;background:linear-gradient(180deg,#8d96a3,#4b5561);border:1px solid #2e353f;border-radius:2px;z-index:3}
  /* Sin batería, dos puntales metálicos bajan desde la viga del panel hasta
     apoyar sobre el techo del chasis (fondo de la ranura y=141 -> chasis y=190):
     el panel nunca queda flotando en el aire. */
  #slot-panel.needs-batt::before{content:"";position:absolute;left:0;right:0;top:100%;height:50px;z-index:1;pointer-events:none;background:linear-gradient(90deg,transparent 24%,#7d8791 24%,#7d8791 25.5%,#4b5561 25.5%,#4b5561 30%,transparent 30%),linear-gradient(90deg,transparent 70%,#7d8791 70%,#7d8791 71.5%,#4b5561 71.5%,#4b5561 76%,transparent 76%)}
  .panel-batt-badge{position:absolute;left:50%;top:-27px;transform:translateX(-50%);background:#2b2003;border:1px solid var(--accent-amber);color:#FCD34D;font-size:9.5px;font-weight:700;letter-spacing:.2px;padding:2px 7px;border-radius:4px;white-space:nowrap;z-index:7;pointer-events:none;box-shadow:0 4px 10px rgba(0,0,0,.4)}
  /* Aviso rápido (toast) */
  .toast{position:fixed;left:50%;bottom:118px;transform:translate(-50%,12px);background:#171A20;border:1px solid var(--accent-amber);color:#FDE68A;font-size:13px;font-weight:600;padding:10px 16px;border-radius:8px;box-shadow:0 10px 24px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;z-index:60;max-width:calc(100vw - 32px);text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ============ ICONOS SVG DE LÍNEA (categorías, herramientas y HUD) ============
     Un solo estilo para todos: trazo de 2px, esquinas redondeadas, sin relleno,
     color heredado (gris #9CA3AF en reposo en las categorías; blanco sobre el
     azul #0088FF cuando el botón está activo). Sin emojis ni imágenes externas. */
  .cat-ico,.ico,.lock-ico,.lock-ico-sm{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .tool-btn .ico{width:22px;height:22px}
  .hud-btn .ico{width:22px;height:22px}
  .nudge-btn .ico{width:20px;height:20px}
  .nudge-btn{color:#E5E7EB}
  .lock-ico-sm{width:12px;height:12px;vertical-align:-1px}
  /* En móvil la tira de categorías es horizontal: icono algo menor y etiqueta legible */
  @media (max-width:1100px){
    .cat-btn .cat-ico{width:19px;height:19px}
    .cat-btn .cat-label{font-size:6.9px}
    .cat-btn{gap:1px;padding:2px 0 1px}
  }
</style>
</head>

     de la URL (?role=) o de localStorage. Sin rol guardado: Ingeniero. */
  var ROLES = {
    ASTRO_ENGINEER:{ id:"ASTRO_ENGINEER", key:"eng", name:"Piloto Ingeniero", bonus:"Bonificación: −15% en costo total", accent:"#F59E0B", suit:"#F6A21E", helmet:"#F97316", visor:"#131E2A", refl:"#FFB648", pack:"#3A4350", boot:"#D97706" },

  };
  var ROLE_ALIAS = { ENGINEER:"ASTRO_ENGINEER", MEDIC:"ASTRO_MEDIC", SOLDIER:"ASTRO_SOLDIER", DEFENDER:"ASTRO_DEFENDER",
    ASTROENGINEER:"ASTRO_ENGINEER", ASTROMEDIC:"ASTRO_MEDIC", ASTROSOLDIER:"ASTRO_SOLDIER", ASTRODEFENDER:"ASTRO_DEFENDER" };
  var ROLE_LS_KEYS = ["role","astroRole","astro_role","playerRole","selectedRole","selectedCharacter","character","pilotRole"];
  function normalizeRole(v){
    if(!v) return null;
    if(typeof v === "object"){ return normalizeRole(v.role || v.astroRole || v.id || v.name || v.character); }
    var s = String(v).trim().toUpperCase().replace(/[\s-]+/g,"_");
    if(ROLES[s]) return ROLES[s];
    var flat = s.replace(/_/g,"");
    if(ROLE_ALIAS[flat]) return ROLES[ROLE_ALIAS[flat]];
    if(ROLE_ALIAS[s]) return ROLES[ROLE_ALIAS[s]];
    return null;
  }
  function resolveRole(){
    var i, r = null;
    var propObjs = [window.MINIGAME_PROPS, window.__MINIGAME_PROPS__, window.gameProps, window.props];
    for(i=0;i<propObjs.length;i++){
      var o = propObjs[i];
      if(o){ r = normalizeRole(o.role || o.astroRole || o.playerRole || o.character || o.selectedRole); if(r) return r; }
    }
    try{
      var qs = new URLSearchParams(window.location.search);
      r = normalizeRole(qs.get("role") || qs.get("astroRole") || qs.get("character"));
      if(r) return r;
    }catch(e){}
    try{
      for(i=0;i<ROLE_LS_KEYS.length;i++){
        var v = window.localStorage ? window.localStorage.getItem(ROLE_LS_KEYS[i]) : null;
        if(v){ if(v.charAt(0)==="{"){ try{ v = JSON.parse(v); }catch(e2){} } r = normalizeRole(v); if(r) return r; }
      }
    }catch(e){}
    return ROLES.ASTRO_ENGINEER;
  }

  function byId(id){ return document.getElementById(id); }

  function polar(cx,cy,r,a){ return [(cx+r*Math.cos(a)).toFixed(1),(cy+r*Math.sin(a)).toFixed(1)]; }
  function B(cx,cy,r){ return '<circle cx="'+cx+'" cy="'+cy+'" r="'+(r||1.8)+'" fill="url(#gHub)" stroke="#38404b" stroke-width=".6"/>'; }
  function R(x,y,w,h,rx,fill,stroke,sw){ return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'"'+(rx?' rx="'+rx+'"':'')+' fill="'+fill+'"'+(stroke?' stroke="'+stroke+'" stroke-width="'+(sw||1)+'"':'')+'/>'; }

  function artBody(p){

    function art(p, isThumb){

  /* ===== Telemetría: solo actualiza los contadores de texto ===== */
  function setStat(id, text, cls){ var el = byId(id); if(!el) return; if(el.textContent!==text) el.textContent = text; var c = cls||""; if(el.className!==c) el.className = c; }
  function compute(){
    var n = wheels6 ? 6 : 4, masa = 0, costo = 0, kwh = 0;
    for(var k in cohete){
      var p = cohete[k]; if(!p) continue;
      var m = (k==="ruedas") ? n : 1;
      masa += p.masa*m; costo += p.costo*m; kwh += (p.kwh||0);
    }
    /* Bonificaciones pasivas por especialidad, aplicadas en tiempo real */
    if(ROLE.id === "ASTRO_ENGINEER") costo = costo * 0.85; /* Finance & Launch: −15% costo total */
    var ch = cohete.chasis, ru = cohete.ruedas;
    var cargaMax = ch ? ch.carga : 0;
    if(ROLE.id === "ASTRO_MEDIC" && ch) cargaMax = Math.round(ch.carga * 1.15); /* Spacecraft & Mass: +15% capacidad (520 -> 598 kg) */
    var vel = 0;
    if(ru){ var load = cargaMax>0 ? Math.min(1, masa/cargaMax) : 1; vel = ru.vel*(1-0.35*load); }
    var trac = ru ? Math.min(100, ru.tracc + (wheels6?8:0)) : 0;
    var cons = masa*0.0013;
    var rango = (cons>0 && kwh>0) ? kwh/cons : 0;
    if(ROLE.id === "ASTRO_SOLDIER") rango = rango * 1.15; /* Orbit & Power: +15% autonomía eléctrica */
    /* Science & Comms: puntuación científica de antenas, taladro y brazo robótico */
    var ciencia = 0;
    if(cohete.antena && cohete.antena.ciencia) ciencia += cohete.antena.ciencia;
    if(cohete.herramienta && cohete.herramienta.ciencia) ciencia += cohete.herramienta.ciencia;
    if(ROLE.id === "ASTRO_DEFENDER" && ciencia > 0) ciencia = Math.round(ciencia * 1.20); /* +20% ciencia */
    var opt = 0; for(var o in OPTIONAL){ if(cohete[o]) opt++; }
    return { n:n, masa:masa, costo:costo, kwh:kwh, cargaMax:cargaMax, vel:vel, trac:trac, rango:rango, opt:opt, ciencia:ciencia };
  }
  function updateTelemetry(){
    var st = compute();
    var count = 0; for(var i=0;i<REQUIRED.length;i++){ if(cohete[REQUIRED[i]]) count++; }
    setStat("val-parts", count+" / 4");
    setStat("val-mass", Math.round(st.masa)+(st.cargaMax?" / "+st.cargaMax:"")+" kg", st.cargaMax ? (st.masa<=st.cargaMax ? "" : "bad") : "");
    setStat("val-vel", st.vel.toFixed(1)+" km/h", st.vel>=8 ? "ok" : (st.vel>0 ? "warn" : ""));
    setStat("val-range", Math.round(st.rango)+" km", st.rango>=50 ? "ok" : (st.rango>=25 ? "warn" : (st.rango>0 ? "bad" : "")));
    setStat("val-trac", Math.round(st.trac)+" %", st.trac>=70 ? "ok" : (st.trac>=50 ? "warn" : (st.trac>0 ? "bad" : "")));
    setStat("val-cost", "$"+fmt(st.costo)+" M", st.costo<=35 ? "ok" : "warn");
    setStat("val-opt", st.opt+" / 4", st.opt>0 ? "ok" : "warn");
    setStat("val-sci", Math.round(st.ciencia||0)+" pts", (st.ciencia||0)>0 ? "ok" : "warn");
    if(isMoving) syncMotionSpeed();
    return st;
  }

  /* ===== Ranuras: actualización granular, una sola ranura por cambio ===== */

      } else {

        el.classList.remove("needs-batt");
        var hint = '<span class="bp-slot-hint">'+SLOT_LABEL[slot]+(OPTIONAL[slot]?"<br>(opcional)":"")+'</span>';

  /* ===== Montaje ===== */

      renderSlot("panel");

  /* ===== Arrastre UNIFICADO por Pointer Events (ratón + dedo + lápiz) ===== */
  var dragState = null;

  function startPotentialDrag(id, x, y){
    var p = findPiece(id);
    if(!p || p.locked) return;
    dragState = { id:id, sx:x, sy:y, active:false, ghost:null };
  }
  function moveDrag(x, y, ev){
    if(!dragState) return;
    var td = dragState;
    if(!td.active){
      if(Math.abs(x - td.sx) + Math.abs(y - td.sy) < 12) return;
      td.active = true;
      var p = findPiece(td.id);
      td.ghost = document.createElement("div");
      td.ghost.className = "drag-ghost";
      td.ghost.innerHTML = p ? art(p, true) : "";
      document.body.appendChild(td.ghost);
    }
    if(ev && ev.cancelable) ev.preventDefault();
    td.ghost.style.left = x + "px";
    td.ghost.style.top = y + "px";
    clearDragOver();
    var el = document.elementFromPoint(x, y);
    var slotEl = el && el.closest ? el.closest(".rv-slot") : null;
    if(slotEl) slotEl.classList.add("drag-over");
  }
  function endDrag(commit, x, y){
    if(!dragState) return;
    var td = dragState; dragState = null;
    if(td.ghost && td.ghost.parentNode) td.ghost.parentNode.removeChild(td.ghost);
    clearDragOver();
    if(!td.active) return;
    suppressClickUntil = Date.now() + 450;
    lastTouchDragEnd = Date.now();
    if(commit){
      var el = document.elementFromPoint(x, y);
      var slotEl = el && el.closest ? el.closest(".rv-slot") : null;
      var slotName = slotEl ? slotNameFromEl(slotEl) : null;
      var piece = findPiece(td.id);
      if(piece && slotName){
        if(piece.slot === slotName){
          if(!(cohete[piece.slot] && cohete[piece.slot].id===piece.id)) equipPiece(piece.id);
          else { selectedSlot = piece.slot; refreshSelection(); showPartInspector(piece); }
        } else { shakeSlot(slotEl); }
      }
    }
  }

  /* ===== Cámara / escala ===== */
  function applyStackTransform(){

  function fitStack(){
    var w = window.innerWidth, h = window.innerHeight;
    var reserveH, reserveW;
    if(h <= 560){ reserveH = 268; reserveW = 40; }
    else if(w <= 860){ reserveH = 430; reserveW = 110; }
    else { reserveH = 210; reserveW = 430; }
    var s = Math.min(1, (h-reserveH)/330, (w-reserveW)/640);
    stackScale = s < 0.3 ? 0.3 : s;
    applyStackTransform();
  }

  /* ===== Modal ===== */
  function openSummaryModal(check){

    var st = compute();
    var order = [
      ["chasis","Chasis"], ["ruedas","Ruedas ×"+st.n], ["bateria","Batería"], ["asiento","Asiento"],
      ["panel","Panel solar (opc.)"], ["antena","Antena (opc.)"], ["herramienta","Herramienta (opc.)"], ["carga","Carga (opc.)"]
    ];
    var html = "";
    for(var i=0;i<order.length;i++){
      var o = order[i], p = cohete[o[0]], mult = (o[0]==="ruedas"?st.n:1);
      html += '<div class="assembled-row"><span style="color:#9CA3AF">'+o[1]+'</span><strong>'+(p ? p.nombre+' ($'+fmt(p.costo*mult)+'M • '+(p.masa*mult)+' kg)' : "— Vacío —")+'</strong></div>';
    }
    html += '<div class="assembled-row"><span style="color:#9CA3AF">Piloto</span><strong>'+ROLE.name+' — '+ROLE.bonus.replace("Bonificación: ","")+'</strong></div>';
    html += '<div class="assembled-row"><span style="color:#9CA3AF">Totales con bonificación</span><strong>$'+fmt(st.costo)+'M • '+Math.round(st.masa)+' / '+st.cargaMax+' kg • '+Math.round(st.rango)+' km</strong></div>';
    html += '<div class="assembled-row"><span style="color:#9CA3AF">Puntuación científica</span><strong>'+Math.round(st.ciencia||0)+' pts'+(ROLE.id==="ASTRO_DEFENDER" && (st.ciencia||0)>0 ? " (incluye +20%)" : "")+'</strong></div>';
    byId("modal-list").innerHTML = html;
    var completo = REQUIRED.every(function(k){ return cohete[k]; });
    var issues = [];
    if(completo){
      if(st.masa > st.cargaMax) issues.push("el chasis está sobrecargado");
      if(st.rango < 50) issues.push("la autonomía es menor a los 50 km de la misión");
      if(st.vel < 8) issues.push("la velocidad es baja");
      if(st.trac < 50) issues.push("la tracción es insuficiente para pendientes");
    }
    var head = "Piezas montadas en el rover", sub = "Componentes instalados en el taller:";
    if(check){
      if(!completo){ head = "Ensamblaje incompleto"; sub = "Faltan piezas obligatorias: chasis, ruedas, batería y asiento del astronauta."; }
      else if(issues.length){ head = "Revisa tu diseño"; sub = "Puedes salir, pero "+issues.join(", ")+"."; }
      else { head = "Rover listo para la misión"; sub = "Autonomía de "+Math.round(st.rango)+" km y tracción de "+Math.round(st.trac)+"%. El astronauta puede salir de la cápsula y partir."; }
    }
    byId("modal-heading").textContent = head;
    byId("modal-sub").textContent = sub;
    byId("summary-modal").classList.add("open");
  }
  function closeSummaryModal(){ document.body.classList.remove("launching"); byId("summary-modal").classList.remove("open"); }

  /* ===== Delegación de eventos: UN listener por contenedor ===== */
  function handleAction(action){
    switch(action){
      case "pause": togglePause(); break;
      case "starter": loadStarterRover(); break;
      case "summary": openSummaryModal(false); break;
      case "launch": openSummaryModal(true); break;
      case "tool-build": setTool("build"); break;
      case "tool-inspect": setTool("inspect"); break;
      case "remove-selected": removeSelectedPiece(); break;
      case "nudge-up": nudgeRover(-16); break;
      case "nudge-down": nudgeRover(16); break;
      case "zoom-in": zoomStack(1.15); break;
      case "zoom-out": zoomStack(0.87); break;
      case "reset-view": resetView(); break;
      case "wheels-4": setWheels(false); break;
      case "wheels-6": setWheels(true); break;
      case "test-traction": testTraction(); break;
      case "close-modal": closeSummaryModal(); break;
      case "confirm-mission": closeSummaryModal(); setMoving(true); break;
    }
  }
  function actionClickHandler(ev){
    var btn = ev.target && ev.target.closest ? ev.target.closest("[data-action]") : null;
    if(!btn) return;
    ev.preventDefault();
    handleAction(btn.getAttribute("data-action"));
  }
  function initDelegation(){
    var q = function(sel){ return document.querySelector(sel); };
    var tl = q(".top-left-controls");   if(tl) tl.addEventListener("click", actionClickHandler);
    var tr = q(".top-right-controls");  if(tr) tr.addEventListener("click", actionClickHandler);
    var lt = q(".left-tools-wrapper");  if(lt) lt.addEventListener("click", actionClickHandler);
    var bl = q(".bottom-left-controls"); if(bl) bl.addEventListener("click", actionClickHandler);

    var strip = q(".category-strip");
    if(strip) strip.addEventListener("click", function(ev){
      var btn = ev.target && ev.target.closest ? ev.target.closest("[data-cat]") : null;
      if(btn) setCategory(btn.getAttribute("data-cat"));
    });

    var grid = byId("parts-grid");
    if(grid){
      grid.addEventListener("click", function(ev){
        if(Date.now() < suppressClickUntil) return;
        var card = ev.target && ev.target.closest ? ev.target.closest("[data-piece-id]") : null;
        if(!card) return;
        var id = card.getAttribute("data-piece-id");
        var p = findPiece(id);
        if(!p) return;
        if(p.locked) unlockPiece(id); else equipPiece(id);
      });
      grid.addEventListener("mouseover", function(ev){
        var card = ev.target && ev.target.closest ? ev.target.closest("[data-piece-id]") : null;
        if(!card) return;
        var p = findPiece(card.getAttribute("data-piece-id"));
        if(p) showPartInspector(p);
      });
      grid.addEventListener("pointerdown", function(ev){
        var card = ev.target && ev.target.closest ? ev.target.closest("[data-piece-id]") : null;
        if(!card) return;
        startPotentialDrag(card.getAttribute("data-piece-id"), ev.clientX, ev.clientY);
      });
      /* HTML5 drag & drop: solo extra de escritorio, nunca única vía */
      grid.addEventListener("dragstart", function(ev){
        var card = ev.target && ev.target.closest ? ev.target.closest("[data-piece-id]") : null;
        if(!card) return;
        draggedId = card.getAttribute("data-piece-id");
        if(ev.dataTransfer) { try{ ev.dataTransfer.setData("text/plain", draggedId); }catch(e){} }
      });
    }

    var stage = q(".rover-stage");
    if(stage){
      stage.addEventListener("click", function(ev){
        var del = ev.target && ev.target.closest ? ev.target.closest("[data-del-slot]") : null;
        if(del){ ev.stopPropagation(); deleteSlotPiece(del.getAttribute("data-del-slot")); return; }
        var slotEl = ev.target && ev.target.closest ? ev.target.closest(".rv-slot") : null;
        if(slotEl){ var sn = slotNameFromEl(slotEl); if(sn) selectSlot(sn); }
      });
      stage.addEventListener("dragover", function(ev){
        var slotEl = ev.target && ev.target.closest ? ev.target.closest(".rv-slot") : null;
        if(!slotEl) return;
        ev.preventDefault();
        clearDragOver();
        slotEl.classList.add("drag-over");
      });
      stage.addEventListener("dragleave", function(ev){
        if(ev.target && ev.target.classList) ev.target.classList.remove("drag-over");
      });
      stage.addEventListener("drop", function(ev){
        ev.preventDefault(); clearDragOver();
        var slotEl = ev.target && ev.target.closest ? ev.target.closest(".rv-slot") : null;
        var slotName = slotEl ? slotNameFromEl(slotEl) : null;
        var id = draggedId || (ev.dataTransfer ? ev.dataTransfer.getData("text/plain") : null);
        draggedId = null;
        var piece = id ? findPiece(id) : null;
        if(!piece || piece.locked || !slotName) return;
        if(piece.slot !== slotName){ shakeSlot(slotEl); return; }
        if(!(cohete[piece.slot] && cohete[piece.slot].id===piece.id)) equipPiece(piece.id);
      });
    }

    var modal = byId("summary-modal");
    if(modal) modal.addEventListener("click", function(ev){
      if(ev.target === modal){ closeSummaryModal(); return; }
      actionClickHandler(ev);
    });

    window.addEventListener("pointermove", function(ev){ moveDrag(ev.clientX, ev.clientY, ev); }, { passive:false });
    window.addEventListener("pointerup", function(ev){ endDrag(true, ev.clientX, ev.clientY); });
    window.addEventListener("pointercancel", function(){ endDrag(false, 0, 0); });
    document.addEventListener("dragend", function(){ draggedId = null; clearDragOver(); });
    window.addEventListener("resize", fitStack);
    window.addEventListener("orientationchange", function(){ setTimeout(fitStack, 60); });
  }

  /* ===== Arranque ===== */
  isPaused = false;
  isLocked = false;
  initDelegation();
  renderPilotBadge();
  renderPartsDrawer();
  loadStarterRover();

</script>
</body>
</html>
