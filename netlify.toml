# Netlify — frontend (React + Vite static build).
# Netlify reads this file from the repo root; the site builds from frontend/.
# Set VITE_BACKEND_URL in Site settings → Environment variables to the Render backend URL
# (e.g. https://astro-squad-backend.onrender.com) BEFORE the first deploy, then redeploy.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: every path serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
